[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgym"
version = "0.1.0"
description = "A small reinforcement-learning environment for AI coding agents."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
# The LLM agents are optional so the whole project works with no API key.
# Gemini is the project's LLM; `llm` installs it.
llm = ["google-genai>=2.0"]
gemini = ["google-genai>=2.0"]
# The Anthropic agent is kept for compatibility but is not used for any
# evaluation or leaderboard result. Install it only if you want to run it.
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
# The package lives directly under engine/, not under a src/ folder.
where = ["."]
include = ["agentgym*"]
