# Render Blueprint — deploys the whole of AgentGym in one go.
#
#   Render dashboard -> New -> Blueprint -> pick this repo -> Apply
#
# It creates two web services:
#   agentgym-api  the FastAPI results service
#   agentgym-web  the Next.js dashboard
#
# It deliberately does NOT create the database. Render allows only one active
# free Postgres per account, so a `databases:` block here fails the whole apply
# for anyone who already has one. Instead you bring a connection string.
#
# Render asks you for three values when you apply this (they are marked
# `sync: false` below). Two are URLs that do not exist until the services do;
# both follow the pattern https://<service-name>.onrender.com, so unless you
# rename anything the answers are:
#
#   NEXT_PUBLIC_API_URL  ->  https://agentgym-api.onrender.com
#   FRONTEND_ORIGIN      ->  https://agentgym-web.onrender.com
#
# The third is DATABASE_URL. See docs/DEPLOY.md for where to get one — any
# Postgres works, and leaving it blank falls back to SQLite, which on a free
# web service is wiped every time the service sleeps or redeploys.
#
# If Render tells you a name is taken it will add a suffix — use the name it
# actually assigned, and update the other service's variable to match.
#
# NOTHING HERE RUNS AGENT CODE. Episodes are played on your own machine with
# the runner CLI; these services only store and show finished results.

services:
  # --- the results API ------------------------------------------------------
  - name: agentgym-api
    type: web
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # $PORT is set by Render. Never hard-code a port here.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.7"
      - key: ENV
        # With ENV=prod the app refuses to start while INGEST_API_KEY is still
        # the default "dev-key". Failing loudly beats running with a key that
        # is published in this repo.
        value: prod
      - key: DATABASE_URL
        # Paste a Postgres connection string. config.py rewrites a
        # postgres:// or postgresql:// prefix to postgresql+psycopg:// for
        # you, so paste it exactly as your provider gives it.
        #
        # Leave it unset and the app falls back to SQLite on the container's
        # disk, which on a free service is wiped by every restart, redeploy
        # and wake-from-sleep. It will look like it works, then silently empty.
        sync: false
      - key: DB_SCHEMA
        # Keeps our tables in their own Postgres schema, which is what makes
        # it safe to share a database with another project: our table names
        # (tasks, episodes, steps) are generic enough to collide, and
        # create_all SKIPS an existing table rather than failing, so without
        # this we could silently bind to someone else's data.
        value: agentgym
      - key: INGEST_API_KEY
        # Render generates this and stores it. Read it from the service's
        # Environment tab when you upload results — it is the --key value.
        generateValue: true
      - key: FRONTEND_ORIGIN
        # Browser requests from any other origin are refused by CORS.
        sync: false

  # --- the dashboard --------------------------------------------------------
  - name: agentgym-web
    type: web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npx next start -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_API_URL
        # Read at build time as well as runtime, so changing it needs a redeploy.
        sync: false
